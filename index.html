<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        bebas: ['Bebas Neue', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="js/main.js" type="module"></script>
</head>

<body class="bg-gray-950">

    <header class="bg-gray-800 border-b border-gray-700 p-5 px-10">
        <div class="flex items-center gap-3">
            <a>
                <span
                    class="text-lg sm:text-4xl text-red-500 font-bold font-bebas font-bold tracking-wider">CineTrack</span>
            </a>
        </div>
    </header>
    <main class="grid grid-cols-[3fr_1fr]">
        <section>
            <div class="m-12">
                <div class="flex items-center justify-between gap-4">
                    <div>
                        <input type="text" id="searchInput" placeholder="Recherche..."
                            class="bg-gray-600 rounded-xl p-3 placeholder:text-white placeholder:font-bold focus:border-4 border-red-500 mx-3 text-white transition-all">
                        <label for="filter" class="text-white font-bold">Filtrer par :</label>
                        <select name="filter" id="filter"
                            class="bg-gray-600 rounded-xl p-3 focus:border-4 border-red-500 text-white font-bold transition-all">
                            <option value="1">Tous</option>
                            <option value="series">Series</option>
                            <option value="movies">Movies</option>
                        </select>
                    </div>

                    <div>
                        <button id="btn-prev" type="button"
                            class="px-3 py-3 rounded-lg bg-gray-600 text-white hover:bg-red-500 transition-all text-sm font-poppins font-medium">Prev</button>
                        <span id="page-info" class="text-sm text-white font-bold px-2">Page # sur #</span>
                        <button id="btn-next" type="button"
                            class="px-3 py-3 rounded-lg bg-gray-600 text-white hover:bg-red-500 transition-all text-sm font-poppins font-medium">Next</button>
                    </div>
                </div>
            </div>

            <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-4 m-12 gap-10">
            </div>
            <div id="detailModal" class="fixed inset-0 bg-black/80 hidden justify-center items-center p-4 z-50">
                <div
                    class="bg-gray-800 border border-gray-700 rounded-xl max-w-3xl w-full relative text-white shadow-2xl overflow-hidden">
                    <button id="closeModal"
                        class="absolute top-3 right-4 text-gray-400 hover:text-red-500 text-3xl font-bold z-10">&times;</button>
                    <div id="modalContent" class="flex flex-col sm:flex-row"></div>
                </div>

            </div>
        </section>

        <aside id="favoriteSidebar"
            class="sticky top-0 h-screen bg-gray-900 border-l border-gray-800 p-6 flex flex-col justify-between shadow-2xl">
            <div>
                <div class="flex items-center justify-between border-b border-gray-800 pb-4">
                    <h2 class="text-2xl font-bebas tracking-wider text-red-500">Mes Favoris</h2>
                </div>
                <div class="flex justify-between text-xs text-gray-300 bg-gray-800/80 rounded-lg p-3 mt-4 font-poppins">
                    <span>Films : <strong id="moviesCount" class="text-white">0</strong></span>
                    <span>Séries : <strong id="seriesCount" class="text-white">0</strong></span>
                </div>
                <ul id="favoriteList" class="mt-4 space-y-3 overflow-y-auto">

                </ul>
            </div>
        </aside>
    </main>
</body>

</html>
